name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-java:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the source code
      - uses: actions/checkout@v2

      # Step 2: Set up Java JDK 1.8
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      # Step 3: Make gradlew executable (for Linux-based runners)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4: Build the Java project using Gradle
      - name: Build with Gradle
        run: ./gradlew build

      # Step 5: Build and push Docker image to Docker Hub
      - name: Build and Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v4
        with:
          image: nanajanashia/demo-app  # <-- Change this to your image name
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
